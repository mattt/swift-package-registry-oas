name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Unit Tests (Swift ${{ matrix.swift }})"

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.3-focal", "6.4"]

    container:
      image: swift:${{ matrix.swift }}

    steps:
      - uses: actions/checkout@v7
      - name: Read the dependency lockfile hash
        id: lockfile
        run: echo "hash=$(git hash-object Package.resolved)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-spm-${{ steps.lockfile.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-spm-
      - run: swift test --enable-test-discovery
